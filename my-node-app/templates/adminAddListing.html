<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Instant Theme Bootstrapper (Default: Light Mode) -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('smr_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Listing | SMR Motors Admin</title>

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Mandatory Stylesheets using Flask url_for -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='adminStyle.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="{{ url_for('index') }}" class="nav-brand">
        <span class="brand-badge"><i class="fas fa-bolt"></i> SMR</span>
        <span>ADMIN CONSOLE</span>
      </a>
      <div class="nav-actions">
        <!-- Theme Toggle Button (Light/Dark Mode) -->
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Switch to Dark Mode" title="Switch to Dark Mode" onclick="window.SMRTheme && window.SMRTheme.toggle()">
          <i class="fas fa-moon"></i>
        </button>
        <a href="{{ url_for('admin_page') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="padding: 4rem 0 6rem;">
    <div class="container" style="max-width: 860px;">
      <div class="section-header" style="margin-bottom: 2.5rem;">
        <span class="section-tag"><i class="fas fa-plus-circle"></i> Inventory Intake</span>
        <h1 class="section-title">Add Motorcycle Listing</h1>
        <p class="section-subtitle">Add directly to showroom inventory with instant verified status.</p>
      </div>

      <div style="background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-lg);">
        <form id="admin-add-bike-form" onsubmit="handleAdminAddBike(event)">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;" class="hero-grid">
            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Brand *</label>
              <select name="brand" class="form-control" required>
                <option value="Royal Enfield">Royal Enfield</option>
                <option value="Yamaha">Yamaha</option>
                <option value="KTM">KTM</option>
                <option value="Bajaj">Bajaj</option>
                <option value="Honda">Honda</option>
                <option value="TVS">TVS</option>
                <option value="Suzuki">Suzuki</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Model *</label>
              <input type="text" name="model" class="form-control" required placeholder="e.g. Hunter 350">
            </div>

            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Title *</label>
              <input type="text" name="title" class="form-control" required placeholder="Listing title">
            </div>

            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Year *</label>
              <input type="number" name="year" class="form-control" required value="2023">
            </div>

            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Selling Price (₹) *</label>
              <input type="number" name="price" id="admin-add-price" class="form-control" min="0" max="1000000" step="1" required placeholder="e.g. 150000 (Max ₹10,00,000)">
              <small style="font-size:0.75rem; color:var(--text-muted);">Allowed: ₹0 to ₹10,00,000</small>
            </div>

            <div>
              <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Kilometers Driven *</label>
              <input type="number" name="kilometers_driven" class="form-control" required placeholder="10000">
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Inspected bike in excellent condition..."></textarea>
          </div>

          <div style="margin-bottom: 2rem;">
            <label style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-weight: 600;">Photos (Up to 6)</label>
            <input type="file" name="attachments" multiple accept="image/*" class="form-control">
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{{ url_for('admin_page') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Add to Inventory</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='config.js') }}"></script>
  <script src="{{ url_for('static', filename='api.js') }}"></script>
  <script>
    async function handleAdminAddBike(e) {
      e.preventDefault();
      const form = e.target;
      const rawPrice = form.querySelector('[name="price"]')?.value?.trim();
      const priceNum = parseFloat(rawPrice);
      if (rawPrice === '' || isNaN(priceNum) || priceNum < 0 || priceNum > 1000000) {
        showToast("Bike price must be between ₹0 and ₹10,00,000.", 'error');
        form.querySelector('[name="price"]')?.focus();
        return;
      }

      const formData = new FormData(form);
      formData.append('status', 'approved');

      try {
        const res = await apiRequest('/api/bikes', {
          method: 'POST',
          body: formData
        });
        showToast(res.message || 'Motorcycle added to showroom inventory', 'success');
        setTimeout(() => { window.location.href = "{{ url_for('admin_page') }}"; }, 1000);
      } catch (err) {
        showToast(err.message || 'Error adding bike', 'error');
      }
    }
  </script>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
