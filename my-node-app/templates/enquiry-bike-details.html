<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Details - SMR Motors</title>
  <link rel="icon" type="image/png" href="/0ebaa9ba-d581-4517-975a-b07ecc2d3c65.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background: #f8fafc;
      font-family: "Plus Jakarta Sans", sans-serif;
      padding-bottom: 50px;
    }
    .container {
      max-width: 900px;
    }
    .header-section {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 35px 25px;
      border-radius: 20px;
      color: white;
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
    }
    .soldout-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #ef4444;
      color: white;
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      transform: rotate(5deg);
      z-index: 99;
    }
    .price-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .price {
      font-size: 32px;
      color: #10b981;
      font-weight: 700;
    }
    .spec-card {
      background: #ffffff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .spec-table td {
      padding: 12px 8px;
      font-size: 15px;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>
</head>

<body>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-dark" onclick="window.history.back()"><i class="fa-solid fa-arrow-left me-1"></i> Back</button>
      <a href="/" class="btn btn-outline-secondary"><i class="fa-solid fa-house me-1"></i> Marketplace Home</a>
    </div>

    <div id="soldOutBadge"></div>
    <div id="header" class="header-section">
      <h2 class="fw-bold mb-1">Loading Bike Details...</h2>
      <p class="text-white-50 mb-0">SMR Motors Certified Inspection</p>
    </div>

    <div id="bikePhotoSection" class="text-center mb-4"></div>

    <div id="priceSection" class="price-box">
      <div class="price">₹ Loading...</div>
    </div>

    <div id="specSection" class="spec-card">
      Loading specifications...
    </div>
  </div>

  <script src="/my-node-app/public/config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const bikeId = params.get("id");

    if (!bikeId) {
      document.getElementById("header").innerHTML = "<h2 class='fw-bold'>Invalid Bike Selection</h2>";
      document.getElementById("priceSection").style.display = "none";
      document.getElementById("specSection").innerHTML = "<p class='text-center text-muted'>Please select a valid bike from the marketplace.</p>";
    } else {
      fetch(`${window.API.BASE_URL}/api/bikes/${bikeId}`)
        .then(res => res.json())
        .then(data => {
          const bike = data.bike || data;
          if (!bike) {
            document.getElementById("header").innerHTML = "<h2 class='fw-bold'>Bike Not Found</h2>";
            document.getElementById("priceSection").style.display = "none";
            document.getElementById("specSection").innerHTML = "";
            return;
          }

          if (bike.status === 'soldout' || bike.isSoldout === 1 || bike.isSoldout === true) {
            document.getElementById("soldOutBadge").innerHTML = `<div class="soldout-badge">SOLD OUT</div>`;
          }

          document.getElementById("header").innerHTML = `
            <h2 class="fw-bold">${bike.title || bike.listingTitle}</h2>
            <p class="text-white-50 mb-0">${bike.brand} ${bike.model} • Registration: ${bike.vehicle_number || bike.vehicleNumber || 'Tamil Nadu'}</p>
          `;

          const images = bike.images || [bike.image];
          const mainImg = Array.isArray(images) && images.length > 0 ? images[0] : (bike.image || "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=700");
          document.getElementById("bikePhotoSection").innerHTML = `
            <img src="${mainImg}" class="img-fluid rounded-4 shadow-sm w-100" style="max-height: 400px; object-fit: cover;">
          `;

          const price = Number(bike.selling_price || bike.sellingPrice || bike.price || 0).toLocaleString();
          document.getElementById("priceSection").innerHTML = `
            <div class="price">₹ ${price}</div>
            <small class="text-muted">Best Market Price with RC Transfer & Verification Assistance</small>
          `;

          document.getElementById("specSection").innerHTML = `
            <h5 class="fw-bold mb-3">Vehicle Specifications</h5>
            <table class="table spec-table">
              <tbody>
                <tr><td><strong>Vehicle Number</strong></td><td>${bike.vehicle_number || bike.vehicleNumber || 'N/A'}</td></tr>
                <tr><td><strong>Condition</strong></td><td>${bike.bike_condition || bike.bikeCondition || 'Good'}</td></tr>
                <tr><td><strong>Make / Brand</strong></td><td>${bike.brand || bike.makedFrom || 'Standard'}</td></tr>
                <tr><td><strong>Model</strong></td><td>${bike.model || bike.bikeModel || ''}</td></tr>
                <tr><td><strong>Kilometers Driven</strong></td><td>${bike.kilometers_driven || bike.bikeKms || '0'} kms</td></tr>
                <tr><td><strong>Buying Year</strong></td><td>${bike.year || bike.bikeBuyingYear || 'N/A'}</td></tr>
                <tr><td><strong>Color</strong></td><td>${bike.bike_color || bike.bikeColor || 'Standard'}</td></tr>
                <tr><td><strong>Engine CC</strong></td><td>${bike.engine_cc || bike.bikeEngineCC || '150cc'}</td></tr>
                <tr><td><strong>Insurance</strong></td><td>${bike.insurance || 'No'}</td></tr>
                <tr><td><strong>Location</strong></td><td>${bike.location || bike.bikeLocation || 'Kelambakkam'}</td></tr>
              </tbody>
            </table>

            <h5 class="fw-bold mt-4 mb-2">Seller Notes & Description</h5>
            <p class="text-muted">${bike.description || "Well maintained pre-owned motorcycle with complete 40-point verification."}</p>
          `;
        })
        .catch(err => {
          document.getElementById("header").innerHTML = "<h2 class='fw-bold'>Error Loading Bike</h2>";
        });
    }
  </script>
</body>
</html>
