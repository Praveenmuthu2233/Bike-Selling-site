<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bike Listings | SMR Motors Admin</title>

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Mandatory Stylesheets using Flask url_for -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='adminStyle.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="{{ url_for('index') }}" class="nav-brand">
        <span class="brand-badge"><i class="fas fa-bolt"></i> SMR</span>
        <span>ADMIN CONSOLE</span>
      </a>
      <div class="nav-actions">
        <a href="{{ url_for('admin_page') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="padding: 4rem 0 6rem;">
    <div class="container">
      <div class="section-header" style="margin-bottom: 2.5rem;">
        <span class="section-tag"><i class="fas fa-motorcycle"></i> Vehicle Fleet</span>
        <h1 class="section-title">All Customer Bike Listings</h1>
        <p class="section-subtitle">Review, approve, or adjust pricing across all submitted inventory.</p>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Motorcycle</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Kilometers</th>
                <th>Seller</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="sellingBikeDetailsAdmin">
              <tr><td colspan="7" style="text-align:center; padding:3rem;"><i class="fas fa-spinner fa-spin"></i> Loading listings...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='config.js') }}"></script>
  <script src="{{ url_for('static', filename='api.js') }}"></script>
  <script>
    async function loadAllBikeListings() {
      const tbody = document.getElementById('sellingBikeDetailsAdmin');
      try {
        const res = await apiRequest('/api/admin/bikes');
        const bikes = res.data || [];
        if (bikes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:3rem;">No bikes found.</td></tr>`;
          return;
        }
        tbody.innerHTML = bikes.map(bike => `
          <tr>
            <td><strong>${bike.year} ${bike.title}</strong></td>
            <td>${bike.brand}</td>
            <td style="color:var(--accent-primary); font-weight:700;">₹${Number(bike.price).toLocaleString('en-IN')}</td>
            <td>${(bike.kilometers_driven||0).toLocaleString()} km</td>
            <td>${bike.seller_name || '-'}</td>
            <td><span class="badge badge-${bike.status==='approved'?'approved':(bike.status==='rejected'?'rejected':'pending')}">${bike.status}</span></td>
            <td>
              <div style="display:flex; gap:0.4rem;">
                ${bike.status !== 'approved' ? `<button onclick="approveBike(${bike.id})" class="btn btn-sm btn-success"><i class="fas fa-check"></i></button>` : ''}
                <button onclick="deleteBike(${bike.id})" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--color-danger);">${err.message}</td></tr>`;
      }
    }

    async function approveBike(id) {
      try {
        await apiRequest(`/api/admin/bikes/${id}/approve`, { method: 'PUT' });
        showToast('Bike approved', 'success');
        loadAllBikeListings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteBike(id) {
      if (!confirm('Are you sure you want to delete this bike?')) return;
      try {
        await apiRequest(`/api/admin/bikes/${id}`, { method: 'DELETE' });
        showToast('Bike deleted', 'success');
        loadAllBikeListings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadAllBikeListings);
  </script>
</body>
</html>
