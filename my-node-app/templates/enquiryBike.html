<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Instant Theme Bootstrapper (Default: Light Mode) -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('smr_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Enquiries | SMR Motors Admin</title>

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Mandatory Stylesheets using Flask url_for -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='adminStyle.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="{{ url_for('index') }}" class="nav-brand">
        <span class="brand-badge"><i class="fas fa-bolt"></i> SMR</span>
        <span>ADMIN CONSOLE</span>
      </a>
      <div class="nav-actions">
        <!-- Theme Toggle Button (Light/Dark Mode) -->
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Switch to Dark Mode" title="Switch to Dark Mode" onclick="window.SMRTheme && window.SMRTheme.toggle()">
          <i class="fas fa-moon"></i>
        </button>
        <a href="{{ url_for('admin_page') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="padding: 4rem 0 6rem;">
    <div class="container">
      <div class="section-header" style="margin-bottom: 2.5rem;">
        <span class="section-tag"><i class="fas fa-phone-volume"></i> Buyer Leads</span>
        <h1 class="section-title">Customer Enquiries & Test Rides</h1>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Customer Name</th>
                <th>Phone / Email</th>
                <th>Motorcycle</th>
                <th>Message</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="buyingBikeDetailsAdmin">
              <tr><td colspan="6" style="text-align:center; padding:3rem;"><i class="fas fa-spinner fa-spin"></i> Loading enquiries...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='config.js') }}"></script>
  <script src="{{ url_for('static', filename='api.js') }}"></script>
  <script>
    async function loadEnquiries() {
      const tbody = document.getElementById('buyingBikeDetailsAdmin');
      try {
        const res = await apiRequest('/api/enquiries');
        const enquiries = res.data || [];
        if (enquiries.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:3rem;">No customer enquiries found.</td></tr>`;
          return;
        }
        tbody.innerHTML = enquiries.map(e => `
          <tr>
            <td><strong>${e.name}</strong><br><small style="color:var(--text-muted);">${new Date(e.created_at).toLocaleDateString()}</small></td>
            <td><a href="tel:${e.phone}" style="color:var(--accent-primary); font-weight:600;"><i class="fas fa-phone"></i> ${e.phone}</a><br><small>${e.email}</small></td>
            <td><strong>${e.bike_title || 'General'}</strong></td>
            <td style="max-width:250px; font-size:0.88rem;">${e.message}</td>
            <td><span class="badge badge-${e.status==='completed'?'approved':'pending'}">${e.status}</span></td>
            <td>
              <button onclick="markDone(${e.id})" class="btn btn-sm btn-success"><i class="fas fa-check"></i> Done</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--color-danger);">${err.message}</td></tr>`;
      }
    }

    async function markDone(id) {
      try {
        await apiRequest(`/api/enquiries/${id}/status`, { method: 'PUT', body: { status: 'completed' } });
        showToast('Enquiry updated to completed', 'success');
        loadEnquiries();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadEnquiries);
  </script>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
