<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In | SMR Motors</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Mandatory Stylesheets using Flask url_for -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='adminStyle.css') }}">
</head>
<body style="background: #070A10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem;">

  <div class="auth-page-wrapper" style="width: 100%; max-width: 460px; margin: 0 auto;">
    <div class="auth-card" style="border: 1px solid rgba(255, 107, 0, 0.35); background: rgba(13, 17, 27, 0.95); backdrop-filter: blur(12px); border-radius: 16px; padding: 2.25rem 2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);">
      
      <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="width: 64px; height: 64px; border-radius: 16px; background: rgba(255, 107, 0, 0.15); border: 1px solid rgba(255, 107, 0, 0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; color: #ff6b00; font-size: 1.75rem;">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="auth-title" style="font-size: 1.65rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem; letter-spacing: -0.5px;">Admin Control Center</h1>
        <p class="auth-subtitle" style="font-size: 0.9rem; color: #8F9CAE; margin: 0;">Restricted portal for authorized SMR Motors managers only.</p>
      </div>

      <div id="login-error-alert" style="display: none; padding: 0.85rem 1rem; border-radius: 8px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; font-size: 0.88rem; margin-bottom: 1.25rem; align-items: center; gap: 0.75rem;">
        <i class="fas fa-exclamation-triangle" style="font-size: 1.1rem; flex-shrink: 0;"></i>
        <span id="login-error-text" style="flex: 1;">Invalid credentials</span>
      </div>

      <form id="admin-login-form" onsubmit="handleAdminLogin(event)" autocomplete="off">
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; color: #C5D1E0; margin-bottom: 0.45rem; font-weight: 600;">Admin Username *</label>
            <div class="input-group" style="position: relative;">
              <i class="fas fa-user input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #8F9CAE;"></i>
              <input type="text" id="admin-username" name="username" class="form-control" required placeholder="admin" value="admin" style="padding-left: 2.75rem; width: 100%; height: 46px; background: #0A0E18; border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; border-radius: 8px;">
            </div>
          </div>

          <div>
            <label style="display: block; font-size: 0.85rem; color: #C5D1E0; margin-bottom: 0.45rem; font-weight: 600;">Secure Password *</label>
            <div class="input-group" style="position: relative;">
              <i class="fas fa-key input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #8F9CAE;"></i>
              <input type="password" id="admin-password" name="password" class="form-control" required placeholder="••••••••••••" value="admin123" style="padding-left: 2.75rem; width: 100%; height: 46px; background: #0A0E18; border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; border-radius: 8px;">
            </div>
          </div>

          <button type="submit" id="admin-submit-btn" class="btn btn-primary" style="margin-top: 0.5rem; width: 100%; height: 48px; font-weight: 700; font-size: 1rem; background: linear-gradient(135deg, #FF6B00 0%, #E05300 100%); border: none; border-radius: 8px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6rem; transition: transform 0.2s, box-shadow 0.2s;">
            <i class="fas fa-sign-in-alt"></i> Authenticate & Enter Console
          </button>
        </div>
      </form>

      <div class="auth-security-notes" style="margin-top: 2rem; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.25rem; display: flex; flex-direction: column; gap: 0.6rem;">
        <div class="security-item" style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: #8F9CAE;">
          <i class="fas fa-fingerprint" style="color: #FF6B00;"></i>
          <span>Encrypted JWT Claims & Multi-Store Session Token</span>
        </div>
        <div class="security-item" style="display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: #8F9CAE;">
          <i class="fas fa-history" style="color: #FF6B00;"></i>
          <span>All administrative actions are permanently audit-logged</span>
        </div>
      </div>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
        <a href="{{ url_for('index') }}" style="color: #8F9CAE; text-decoration: none; transition: color 0.2s;">&larr; Return to Marketplace</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='config.js') }}"></script>
  <script src="{{ url_for('static', filename='api.js') }}"></script>
  <script>
    // Prevent redirect loops: only redirect if a valid session already exists
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
      if (token) {
        // Quick verify session without loop
        fetch('/api/admin/dashboard', {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(res => {
          if (res.ok) {
            window.location.href = "{{ url_for('admin_page') }}";
          } else {
            // Expired token: clear and stay on login page
            localStorage.removeItem('adminToken');
            sessionStorage.removeItem('adminToken');
          }
        }).catch(() => {
          // If offline/error, stay on login page
        });
      }
    });

    async function handleAdminLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error-alert');
      const errText = document.getElementById('login-error-text');
      errBox.style.display = 'none';

      const btn = document.getElementById('admin-submit-btn');
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      const payload = {
        username: document.getElementById('admin-username').value.trim(),
        password: document.getElementById('admin-password').value
      };

      try {
        const res = await apiRequest('/api/admin/login', {
          method: 'POST',
          body: payload
        });

        if (res.token) {
          localStorage.setItem('adminToken', res.token);
          localStorage.setItem('adminUser', JSON.stringify(res.admin));
          sessionStorage.setItem('adminToken', res.token);
          showToast('Admin authentication confirmed!', 'success');
          setTimeout(() => {
            window.location.href = "{{ url_for('admin_page') }}";
          }, 400);
        } else {
          throw new Error(res.message || 'Authentication failed');
        }
      } catch (err) {
        errBox.style.display = 'flex';
        errText.innerText = err.message || 'Invalid administrator credentials. Please check your username and password.';
        showToast(err.message || 'Invalid credentials', 'error');
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    }
  </script>
</body>
</html>
