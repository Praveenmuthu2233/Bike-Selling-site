<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Instant Theme Bootstrapper (Default: Light Mode) -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('smr_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SMR Motors - Create Account with Google</title>
  <meta name="description" content="Create your SMR Motors account with Google to list pre-owned bikes for sale, track enquiries, and save your favorite motorcycles.">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Mandatory Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-badge"><i class="fas fa-bolt"></i> SMR</span>
        <span>MOTORS<span class="brand-accent">.</span></span>
      </a>
      <div class="nav-actions">
        <!-- Theme Toggle Button (Light/Dark Mode) -->
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Switch to Dark Mode" title="Switch to Dark Mode" onclick="window.SMRTheme && window.SMRTheme.toggle()">
          <i class="fas fa-moon"></i>
        </button>
        <a href="index.html" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Home</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand-icon">
            <i class="fas fa-user-plus"></i>
          </div>
          <h1 class="auth-title">Join SMR Motors</h1>
          <p class="auth-subtitle">Create your account in seconds using Google Sign-In. No password to remember.</p>
        </div>

        <!-- Google OAuth 2.0 GIS Button Container -->
        <div id="google-register-btn" style="display: flex; justify-content: center; min-height: 44px; margin-bottom: 1rem;">
          <!-- Rendered by Google Identity Services -->
        </div>

        <!-- Fallback Google Action Button -->
        <button onclick="triggerGoogleSignUpPrompt()" class="btn-google">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>Instant Demo</span>
        </div>

        <div class="demo-signin-box">
          <p>Test all user dashboard features with our sandbox profile:</p>
          <button onclick="AuthService.demoLogin()" class="btn btn-secondary" style="width: 100%;">
            <i class="fas fa-play"></i> Launch Demo Account
          </button>
        </div>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
          Already have an account? <a href="login.html" style="color: var(--accent-primary); font-weight: 600;">Sign In &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthService.getUser();
      if (user) {
        window.location.href = 'user/dashboard.html';
        return;
      }
      setTimeout(() => initGoogleAuth('google-register-btn'), 300);
    });

    function triggerGoogleSignUpPrompt() {
      if (window.google && window.google.accounts) {
        window.google.accounts.id.prompt();
      } else {
        AuthService.demoLogin();
      }
    }
  </script>
  <script src="assets/js/theme.js"></script>
</body>
</html>
